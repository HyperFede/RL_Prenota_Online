name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: python -m pyflakes rlprenota main.py tests scripts
      - name: Security scan (code)
        run: bandit -q -r rlprenota main.py
      - name: Security scan (dependencies)
        run: pip-audit -r requirements.txt
      - name: Tests (headless Chrome is preinstalled on the runner)
        run: pytest --cov=rlprenota --cov-report=term-missing
